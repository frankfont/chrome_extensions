<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1f36"/>
      <stop offset="100%" stop-color="#0d1220"/>
    </linearGradient>
    <linearGradient id="brushHandle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4962e"/>
      <stop offset="100%" stop-color="#8b5e0a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="22" fill="url(#bg)"/>

  <!-- Code markup brackets < > -->
  <polyline points="34,26 7,64 34,102"
            fill="none" stroke="#5b9cf6" stroke-width="9"
            stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="94,26 121,64 94,102"
            fill="none" stroke="#5b9cf6" stroke-width="9"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Paintbrush: designed vertically, rotated 45deg so
       handle sits top-right and bristle tip sits bottom-left -->
  <g transform="rotate(45, 64, 64)">
    <!-- Wooden handle -->
    <rect x="58" y="6" width="12" height="60" rx="6" fill="url(#brushHandle)"/>
    <!-- Handle grip ring -->
    <rect x="58" y="52" width="12" height="5" rx="1" fill="#7a4808" opacity="0.6"/>
    <!-- Ferrule (silver metal band) -->
    <rect x="55" y="66" width="18" height="11" rx="2" fill="#b8b8b8"/>
    <rect x="55" y="66" width="18" height="3" rx="1" fill="#d4d4d4"/>
    <!-- Bristles (trapezoid: wide at ferrule, flat bottom) -->
    <path d="M55,77 L73,77 L69,110 L59,110 Z" fill="#f5e6c0"/>
    <!-- Bristle tip flat end accent -->
    <rect x="59" y="107" width="10" height="4" rx="1" fill="#e2c060" opacity="0.9"/>
  </g>
</svg>
